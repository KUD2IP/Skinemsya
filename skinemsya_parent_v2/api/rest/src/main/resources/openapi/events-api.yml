openapi: 3.0.3
info:
  title: Skinemsya Events REST API
  version: 1.0.0
paths: {}
components:
  schemas:
    CreateEventRequest:
      type: object
      required:
        - name
        - payerId
        - expectedParticipantCount
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 5000
        payerId:
          type: integer
          format: int64
          minimum: 1
        expectedParticipantCount:
          type: integer
          format: int32
          minimum: 2
          maximum: 99
    UpdateEventRequest:
      type: object
      required:
        - name
        - payerId
        - expectedParticipantCount
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 5000
        payerId:
          type: integer
          format: int64
          minimum: 1
        expectedParticipantCount:
          type: integer
          format: int32
          minimum: 2
          maximum: 99
    UpdateExpectedParticipantsRequest:
      type: object
      required:
        - expectedParticipantCount
      properties:
        expectedParticipantCount:
          type: integer
          format: int32
          minimum: 2
          maximum: 99
    EventResponse:
      type: object
      required:
        - id
        - groupId
        - name
        - payerId
        - createdBy
        - status
        - payerRequisitesReady
        - expectedParticipantCount
        - joinedCount
        - currentUserJoined
      properties:
        id:
          type: integer
          format: int64
        groupId:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        payerId:
          type: integer
          format: int64
        createdBy:
          type: integer
          format: int64
        status:
          type: string
          enum:
            - DRAFT
            - DISTRIBUTION
            - CALCULATED
            - COMPLETED
        payerRequisitesReady:
          type: boolean
        expectedParticipantCount:
          type: integer
          format: int32
        joinedCount:
          type: integer
          format: int64
        currentUserJoined:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    InviteLinkResponse:
      type: object
      required:
        - url
        - startParam
        - shareText
      properties:
        url:
          type: string
        startParam:
          type: string
        shareText:
          type: string
    PageEventResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EventResponse'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
