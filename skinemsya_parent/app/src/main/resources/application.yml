spring:
  application:
    name: skinemsya
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../../.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USER:skinemsya}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      # Согласовано с skinemsya.file-storage.max-upload-size-bytes (20 МБ);
      # без этого действует дефолт Spring в 1 МБ и загрузка фото чека падает.
      max-file-size: ${FILE_MAX_UPLOAD_SIZE_BYTES:20971520}
      # Чуть больше max-file-size: запас на multipart-оверхед (boundary, заголовки).
      max-request-size: 25MB
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

skinemsya:
  jwt:
    secret: ${JWT_SECRET:}
    access-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-ttl: ${JWT_REFRESH_TTL:7d}
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    auth-max-age-seconds: ${TELEGRAM_AUTH_MAX_AGE_SECONDS:86400}
    mini-app-url: ${TELEGRAM_MINI_APP_URL:}
    webhook-secret: ${TELEGRAM_WEBHOOK_SECRET:}
    bot-username: ${TELEGRAM_BOT_USERNAME:}
    web-app-short-name: ${TELEGRAM_WEB_APP_SHORT_NAME:}
    bot-polling-enabled: ${TELEGRAM_BOT_POLLING_ENABLED:true}
  cors:
    allowed-origin-patterns:
      - http://localhost:*
      - http://127.0.0.1:*
      - https://web.telegram.org
  receipt-vision:
    api-key: ${OPENROUTER_API_KEY:}
    base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
    model: ${OPENROUTER_RECEIPT_MODEL:qwen/qwen3.8-flash}
    timeout: ${OPENROUTER_TIMEOUT:30s}
    max-image-side: ${OPENROUTER_MAX_IMAGE_SIDE:1600}
  admin:
    usernames: ${ADMIN_USERNAMES:kudzip}
  subscription:
    enforced: ${SUBSCRIPTION_ENFORCED:true}
    price-kopecks: ${SUBSCRIPTION_PRICE_KOPECKS:4900}
    period-days: ${SUBSCRIPTION_PERIOD_DAYS:30}
    stars: ${SUBSCRIPTION_STARS:25}
    max-parses-per-day: ${SUBSCRIPTION_MAX_PARSES_PER_DAY:100}
    yookassa:
      shop-id: ${YOOKASSA_SHOP_ID:}
      secret-key: ${YOOKASSA_SECRET_KEY:}
      return-url: ${YOOKASSA_RETURN_URL:${TELEGRAM_MINI_APP_URL:}}
      vat-code: ${YOOKASSA_VAT_CODE:1}
      receipt-enabled: ${YOOKASSA_RECEIPT_ENABLED:true}
  file-storage:
    type: ${FILE_STORAGE_TYPE:local}
    path: ${FILE_STORAGE_PATH:./storage}
    max-upload-size-bytes: ${FILE_MAX_UPLOAD_SIZE_BYTES:20971520}
    s3:
      endpoint: ${S3_ENDPOINT:}
      region: ${S3_REGION:us-east-1}
      bucket: ${S3_BUCKET:skinemsya-files}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{X-Correlation-Id:-}]"
